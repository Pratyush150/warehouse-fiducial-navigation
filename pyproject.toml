[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "warehouse-nav"
version = "0.1.0"
description = "Grid warehouse robot: floor-fiducial localisation fused with odometry, A* planning and pick tasks, measured"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Pratyush Vatsa" }]
keywords = ["warehouse", "fiducial", "ekf", "localization", "a-star", "mobile-robot"]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
figures = ["matplotlib>=3.5"]
dev = ["pytest>=7.0", "matplotlib>=3.5"]

[project.urls]
Homepage = "https://github.com/Pratyush150/warehouse-fiducial-navigation"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
